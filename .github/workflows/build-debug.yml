name: build-debug

on:
  push:
    branches: [ main ]

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096M -Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.caching=true"

jobs:
  build-android:
    name: Build Android Debug
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Gradle setup
        uses: ./.github/actions/gradle-setup

      - name: Build Android debug APK
        env:
          UM_API_KEY: ${{ secrets.UM_API_KEY }}
        run: ./gradlew :androidApp:assembleDebug -PUM_API_KEY=$UM_API_KEY

      - name: Upload Android debug APK
        uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: androidApp/build/outputs/apk/debug/*.apk

  build-ios:
    name: Build iOS simulator debug app
    runs-on: macos-latest
    env:
      UM_API_KEY: ${{ secrets.UM_API_KEY }}
    steps:
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Checkout
        uses: actions/checkout@v7

      - name: Gradle setup
        uses: ./.github/actions/gradle-setup

      - name: Build iOS simulator app
        run: |
          xcodebuild build \
          -project iosApp/iosApp.xcodeproj \
          -configuration Debug \
          -scheme iosApp \
          -sdk iphonesimulator \
          -derivedDataPath ./build \
          -verbose

      # The KMP resource bundles inside ComposeApp.framework contain colons in
      # their names (e.g. WarsawTransportMap.core:common.bundle), which
      # actions/upload-artifact rejects as invalid characters. Archive the build
      # products first so the artifact only contains a single file with a valid
      # name; ditto also preserves symlinks and executable permissions.
      - name: Package iOS simulator app
        run: |
          cd build/Build/Products
          ditto -c -k --keepParent Debug-iphonesimulator "$GITHUB_WORKSPACE/iphonesimulator-app.zip"

      - name: Upload App Folder
        uses: actions/upload-artifact@v7
        with:
          name: iphonesimulator-app
          path: iphonesimulator-app.zip
          if-no-files-found: error
